name: Pinterest Cloud Pipeline

on:
  workflow_dispatch:
    inputs:
      action_type:
        description: 'Action to perform'
        required: false
        default: 'create_accounts'

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Google Chrome, Xvfb, Rclone, and JQ
        run: |
          wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          sudo sh -c 'echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" >> /etc/apt/sources.list.d/google-chrome.list'
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable xvfb rclone jq

      - name: Configure Rclone for Engine Pull
        env:
          DATA_TOKEN_RAW: ${{ secrets.G_DRIVE_TOKEN }}
        run: |
          mkdir -p ~/.config/rclone
          
          D_ACCESS=$(echo "$DATA_TOKEN_RAW" | jq -r '.token')
          D_REFRESH=$(echo "$DATA_TOKEN_RAW" | jq -r '.refresh_token')
          D_EXPIRY=$(echo "$DATA_TOKEN_RAW" | jq -r '.expiry')
          CLIENT_ID=$(echo "$DATA_TOKEN_RAW" | jq -r '.client_id')
          CLIENT_SECRET=$(echo "$DATA_TOKEN_RAW" | jq -r '.client_secret')
          DATA_TOKEN="{\"access_token\":\"$D_ACCESS\",\"token_type\":\"Bearer\",\"refresh_token\":\"$D_REFRESH\",\"expiry\":\"$D_EXPIRY\"}"
          
          echo "[gdrive]" > ~/.config/rclone/rclone.conf
          echo "type = drive" >> ~/.config/rclone/rclone.conf
          echo "client_id = $CLIENT_ID" >> ~/.config/rclone/rclone.conf
          echo "client_secret = $CLIENT_SECRET" >> ~/.config/rclone/rclone.conf
          echo "scope = drive" >> ~/.config/rclone/rclone.conf
          echo "token = $DATA_TOKEN" >> ~/.config/rclone/rclone.conf

      - name: Pull Pinterest Engine from G-Drive
        run: |
          echo "[*] Pulling Python Engine from Google Drive..."
          # Update the source path below to match exactly where you place the Pinterest folder on your G-Drive
          rclone copy "gdrive:Dropshipping/Pinterest" ./engine -v

      - name: Install Python Dependencies
        run: |
          cd engine
          pip install -r requirements.txt undetected-chromedriver selenium

      - name: Execute Pipeline (Zero-Fingerprint Headed)
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_API_KEY_2: ${{ secrets.NVIDIA_API_KEY_2 }}
          GMAIL_MASTER_ADDRESS: ${{ secrets.GMAIL_MASTER_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          cd engine
          echo "[*] Booting pipeline via Xvfb headed Chrome..."
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python main_local_test.py
