name: Pinterest Cloud Pipeline

on:
  workflow_dispatch:
    inputs:
      action_type:
        description: 'Action to perform'
        required: false
        default: 'create_accounts'

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Google Chrome, Xvfb, Rclone, and JQ
        run: |
          wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          sudo sh -c 'echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" >> /etc/apt/sources.list.d/google-chrome.list'
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable xvfb rclone jq

      - name: Configure Rclone for Engine Pull
        env:
          G_DRIVE_TOKEN_RAW: ${{ secrets.G_DRIVE_TOKEN }}
        run: |
          python -c '
          import os, json, urllib.request, urllib.parse
          os.makedirs(os.path.expanduser("~/.config/rclone"), exist_ok=True)
          d = json.loads(os.environ["G_DRIVE_TOKEN_RAW"])

          client_id     = d.get("client_id", "")
          client_secret = d.get("client_secret", "")
          refresh_token = d.get("refresh_token", "")

          # Always get a fresh access token using the refresh_token
          print("[*] Refreshing Google access token...")
          payload = urllib.parse.urlencode({
              "client_id":     client_id,
              "client_secret": client_secret,
              "refresh_token": refresh_token,
              "grant_type":    "refresh_token"
          }).encode()
          req = urllib.request.Request(
              "https://oauth2.googleapis.com/token",
              data=payload,
              headers={"Content-Type": "application/x-www-form-urlencoded"}
          )
          resp = json.loads(urllib.request.urlopen(req).read())
          fresh_access_token = resp["access_token"]
          print("[+] Token refreshed successfully.")

          token_obj = {
              "access_token":  fresh_access_token,
              "token_type":    "Bearer",
              "refresh_token": refresh_token,
              "expiry":        "2030-01-01T00:00:00Z"
          }
          conf = "[gdrive]\ntype = drive\nclient_id = " + client_id + "\nclient_secret = " + client_secret + "\nscope = drive\ntoken = " + json.dumps(token_obj) + "\n"
          with open(os.path.expanduser("~/.config/rclone/rclone.conf"), "w") as f:
              f.write(conf)
          print("[+] rclone.conf written successfully.")
          '

      - name: Pull Pinterest Engine from G-Drive
        run: |
          echo "[*] Pulling Python Engine from Google Drive..."
          # Update the source path below to match exactly where you place the Pinterest folder on your G-Drive
          rclone copy "gdrive:Dropshipping/Pinterest" ./engine -v

      - name: Install Python Dependencies
        run: |
          cd engine
          pip install -r requirements.txt undetected-chromedriver selenium

      - name: Execute Pipeline (Zero-Fingerprint Headed)
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_API_KEY_2: ${{ secrets.NVIDIA_API_KEY_2 }}
          GMAIL_MASTER_ADDRESS: ${{ secrets.GMAIL_MASTER_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          cd engine
          echo "[*] Booting pipeline via Xvfb headed Chrome..."
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python -u main_local_test.py
